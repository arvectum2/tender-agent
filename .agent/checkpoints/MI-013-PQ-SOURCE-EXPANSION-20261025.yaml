  - New deterministic expected 17 records / 0 verified awards; new tests added.
  - Initial CI run 40213600708: 5291 passed, 285 skipped, 3 failed in MI003 due in-place overwrite of frozen v1; root cause fixed by restoring pinned v1 and introducing v2.
  - Full exact-head CI rerun 40214539497 on updated v2 source/test/doc commit cfbbb2fd0cd11b2c09e2905923d6d0ab6b43abfd is in_progress at checkpoint; never claim PASS until verified.
  - 2026-10-26 full make test attempted with venv; 5298 PASS, 286 SKIP, one unrelated R9 backup/restore integration failure (pg_restore). Focused R9 rerun after PostgreSQL16 binary PATH passed 5/5; full suite green rerun still pending.
  - 2026-10-26 targeted after source alias dedup: 56 MI013 tests PASS, Ruff clean.
  - 2026-10-26 full Mac mini make test after correct PostgreSQL16 PATH: 5300 PASS, 286 SKIP, 357 warnings, exit 0. No claims of signed contract or TAM completeness.
  - Extended 16 industrial regions plus Moscow/SPb source cohorts: 144/37316 SHA-audited day cells, 298 archives and 21183 XML, 45 incomplete, zero invalid.
  - 128 generic EPC titles identified in separate original notice XML screen, NOT counted PQ without equipment specs.
  - Prior GitHub CI job 121464244794 failed on mismatch commercial vs discovery/bidzaar canonical_id; FIXED in isolated branch commit a75af741, regression passed.
resume_instruction: Verify exact-head GitHub CI and local make test after latest 45-record/3-registered-RD223-1-judicial-hardware case commit. Expand 2024-2025 original EIS 223-FZ and commercial ETP primary tender attachments, true suppliers and registered total with proper VAT/price-type, maintain no national market TAM. RD223 case 32616412267 now signed with different contract value than bid, scope maintenance; do not double-count Gaysky two tenders as two fulfilled supplies. Stage in_progress until accurate market coverage, signed goods contracts and manufacturer qualification documented.

