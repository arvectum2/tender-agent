status: in_progress
goal: Build auditable Russian medium-voltage 6-35kV Power Quality 2024-2026 procurement corpus with source archives, extracted technical annexes, protocols, suppliers, signed contract prices and bounded market estimates.
definition_of_done:
  - Preserve 12 existing evidence leads and add five distinct externally traced cases for 2026.
  - Keep signed price, winner, tender status and equipment-specific amount unverified without primary proof.
  - Extend pure deterministic tests and publish source-bound research update.
  - Verify exact branch with GitHub CI; record test evidence and commit SHA, without merging under stale or uncertain AM-4.
  - Independently verify signed contract registries, legal winner identities, financial amounts and equipment-specific attributions; never infer national totals from sparse source-days.
  - Expand 2024-2026 original EIS/ETP regional evidence and technical annex semantic search sufficiently to support a qualified final market report, or retain in_progress with precise coverage gap.
completed:
  - Confirmed Mac mini ARC online, isolated the dirty unrelated local APR-07 branch; repository main is the source of truth.
  - Identified 21 of 4388 verified selected EIS source-day cells and existing MI-008 through MI-012 integration path.
  - Independently located five new public procurement cards and reviewed the anomalous Nagornaya contract claim and mixed-lot filter scope.
  - Preserved immutable 2026-10-24 baseline v1 (12 records), moved 17-record research snapshot to verified_public_leads_20261025.v2.json, and switched tests to v2; deterministic cross-file checks pass for 12/17 counts, identities and zero award claims.
current: Official original-source 10kV/3Mvar UKRM PS Vyartsilya and primary EPC budget split now verified; 37 discovery records (27 prior plus 8 secondary and 2 original notices; latter repeat is one existing project need); 202 verified region-source days, 381 ZIP, 25629 XML over 18 regions, still not national coverage. New original case 32616497692 is tender open at current observation with no awarded supplier; prior cases original-source official 223-FZ dossiers completed for 32615614821 and 32616120582; 7 original attachments for EACH downloaded with 13 nested 7z files (Nagornaya) and 18 nested ZIP files (Karelia); confirmed 6/6.3kV UKRM specification, named single bidder TechnoProm offer 1.8333583m ex VAT, Karelia winning application 4149972340 17m EPC offer (legal name unknown). 27 distinct discovery procedures after merging internal 26Т0110040.0017 alias to official 32616120582; no signed contract prices. Industrial eight-region 33 verified source-days/42 ZIP/2220 XML, 15 incomplete, plus Moscow-SPb 53/176/14573 and 4 incomplete; no national TAM.
pending:
  - Verify fresh exact-head CI on the final checkpoint-only commit and reproducible report/test results; resolve any failures.
  - Reconcile the actual official signed contract registers and winner INN for 32615614821 and 32616120582; do not promote selected bidder/app or bid offer to signed price.
  - Expand source-day coverage to missing days and regions beyond the ten sampled regions; ingest original EPC technical annexes into source-bound Data Platform search.
  - Verify official ETP protocols/contracts for the other 26 discovery candidates and classify each 6-35kV vs low-voltage or maintenance.
