goal: 'Deliver the next bounded Daily Tender Run stage: after an attributable human GO, automatically prepare factual readiness artifacts and advance submission/outcome tracking only from grounded evidence, without performing consequential ETP/signature/payment/submission actions.'
definition_of_done:
- Start from current main with DTR-1/DTR-2 and MOB-1/MOB-2/MOB-3 behavior preserved.
- A canonical human GO can move an eligible Daily Tender Run item from WAIT_HUMAN into a restartable POST_DECISION stage without auto-deciding participation.
- POST_DECISION reuses existing canonical readiness/application/package services and records a deterministic readiness snapshot or explicit blocked/unknown state; it does not fabricate application completeness.
- TRACK_SUBMISSION advances only from canonical explicit-human or source-grounded submission evidence; absence of evidence leaves the case pending and never claims submission.
- TRACK_OUTCOME consumes existing public/source-grounded outcome evidence and updates the canonical lifecycle/portfolio idempotently; absence or ambiguity remains pending/unknown.
- DTR resume/run paths can continue already-decided items through the new stages without chat orchestration and without redoing completed work.
- Failures in one procurement remain isolated, persisted and restartable.
- No ETP login/action, bid submission/modification, EDS/UKЭП/private-key use, payment, bank guarantee purchase, supplier/customer outreach, or autonomous GO/NO GO is introduced.
- Focused backend tests cover GO transition, readiness grounding, submission evidence gating, outcome grounding, idempotent resume and fail-closed behavior.
- Relevant deterministic tests and git diff checks pass; exact-head CI is green before merge.
- Roadmap/checkpoint are reconciled after merge and the canonical checkpoint is marked completed.
