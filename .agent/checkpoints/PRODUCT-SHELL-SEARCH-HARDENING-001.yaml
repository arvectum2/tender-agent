  - Added query_relevance separate from supplier_fit; public cards now display query-match score rather than supplier participation recommendation.
  - Added fail-closed customer-name sanitization for JavaScript/HTML contamination.
  - Added capped common-info enrichment for missing customer/deadline; Axioma resolves to the authoritative Department customer and 05.10.2026 deadline.
  - Reworked public-source diagnostics to describe public read-only search without contradictory SOAP token language.
  - Changed search-result action to "Получить документацию"; handoff shows elapsed progress and sends analyze_after_download=false so analysis remains an explicit next step.
  - Added visible deadline and status fields to public result cards.
  - Added focused regression suite tests/test_product_shell_search_hardening.py.
  - Re-ran live Safari UI for "разработка ПО" and "разработка программн обеспеч": both returned only target Axioma procurement 0187200001726001304 in the tested active/date window, with 100% query match, correct customer, deadline and active status.
  - Live Axioma handoff created run toa-run-20261003180241-ad8a9f, downloaded/extracted 5 documents, status ready_to_analyze, analysis_status not_started, and preserved correct customer/deadline.
