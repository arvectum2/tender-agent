goal: Harden the current Tender Agent product shell based on the first live operator UX iteration so real software-development procurements can be found, understood and handed off to analysis reliably.
definition_of_done:
  - UI exposes an explicit active/current procurement filter and applies it to public search.
  - Query handling for abbreviations/phrases such as "разработка ПО" no longer degenerates into generic "разработка" noise; target Axioma procurement remains discoverable.
  - Search-card customer attribution fails closed on missing/corrupted HTML/JS contamination and uses safer extraction where supported.
  - Discovery relevance reflects query-to-procurement match and is not mislabeled by supplier-profile-only scoring.
  - EIS diagnostics copy is internally consistent and reflects the actual configured public-search path.
  - Search-result handoff creates a run promptly and exposes visible progress/status rather than appearing hung in one synchronous action.
  - Focused regression tests cover every confirmed defect.
  - Real Safari/RDC regression reruns both software-development queries and verifies Axioma workflow.
completed:
