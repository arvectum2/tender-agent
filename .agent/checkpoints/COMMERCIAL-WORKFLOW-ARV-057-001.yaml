definition_of_done:
- Historical observations reuse canonical procurement/price evidence and existing
  normalization primitives rather than creating a generic price engine.
- Every included observation is source-bound and exposes the exact basis used for
  comparison.
- Comparability rules are deterministic and explicit; incomparable currency/unit/quantity
