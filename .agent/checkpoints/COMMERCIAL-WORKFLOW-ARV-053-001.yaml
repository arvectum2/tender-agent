definition_of_done:
- Customer/supplier counterparty cards reuse existing canonical identity/profile data
  rather than creating a competing registry.
- Every displayed risk/quality factor carries source/evidence provenance or is explicitly
  unknown when evidence is unavailable.
- Aggregate presentation is explainable from factor-level signals and uncertainty;
  no opaque score or authoritative legal/reliability approval is produced.
- Customer and supplier roles remain distinct and are not inferred from ambiguous
  counterparty text.
- Focused tests and relevant regression tests pass.
- Exact-head GitHub CI passes before merge.
