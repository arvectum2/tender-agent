goal: 'Deliver the third bounded ARV-044 mobile slice: APNs push plumbing and safe deep links that open the correct Tender
  Agent procurement case on iPhone.'
definition_of_done:
- MOB-3 starts from current main with completed MOB-1 and MOB-2 behavior preserved.
- Native iOS app can request notification permission, register for remote notifications, receive an APNs device token, and
  persist/sync that token through a dedicated Bearer-authenticated mobile API boundary.
- Backend stores mobile push registrations idempotently without exposing APNs credentials or broadening the existing private
  Tailscale MVP boundary.
- Push payload contract identifies a Tender Agent case with a bounded deep-link target; tapping a notification opens the correct
  procurement detail when that case exists.
- App accepts the same bounded deep-link contract from custom URL handling without performing any procurement decision or
  external commercial action.
- Token/auth/network failures are surfaced safely and do not mutate procurement decision state.
- Backend contract tests cover registration/idempotency and push/deep-link payload generation; focused iOS tests cover deep-link
  parsing/routing and token request encoding.
- Xcode project builds on current Xcode and focused tests pass on a configured simulator; physical-device APNs delivery is
  attempted only if available and any external Apple credential/provisioning limitation is recorded rather than fabricated.
- No automatic procurement decision, ETP action, signature, payment, bid submission, or external customer/supplier communication
  is introduced.
- Roadmap/checkpoint are reconciled, exact-head CI is green, and the implementation is merged under the explicit Owner directive
  unless a real blocker appears.
