# Filtered executable projection of docs/roadmap/master-roadmap.yaml.
# This file is intentionally narrower than the full product roadmap.
# Presence in the master roadmap does not grant execution authority or queue admission.
# The executor may update allowed execution status/evidence only; it must not silently
# create priorities, resolve roadmap ID conflicts, infer ARV mappings, or change gates.
version: 3
repository: arvectum2/tender-agent
