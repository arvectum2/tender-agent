goal: 'Deliver the first executable Commercial Core slice: customer price-list/catalog ingest -> normalized catalog -> tender-to-catalog
  matching -> auditable coverage/cost/economic headroom -> commercial feasibility -> human-controlled next action.'
definition_of_done:
- Define a versioned Commercial Core v1 contract with normalized catalog rows, source provenance, match results, coverage/economic
  outputs, unknowns and human-control flags.
- Import XLSX and CSV price lists using reusable parsers with deterministic common-column detection/mapping and row/sheet
  provenance; ambiguous layouts fail closed to review.
- Normalize SKU/article, brand/manufacturer, title/name, unit, price/currency and optional characteristics without inventing
  missing values.
- Match tender positions to catalog rows with explicit EXACT / LIKELY_ANALOG / PARTIAL / UNCERTAIN / NO_MATCH statuses, deterministic
  rationale/evidence and no price-only relevance.
- Calculate coverage, known catalog cost and commercial headroom/margin only when required source inputs are present; otherwise
  return explicit Unknown/Needs Review.
- Expose Commercial Core through the existing product/report/API path and produce a commercial feasibility result that informs
  but never autonomously executes bid/no-bid.
- Add regression tests for clean XLSX/CSV, ambiguous columns, missing price, exact/analog/partial/uncertain/no-match, duplicate
  SKUs, unit mismatch and unknown economics.
- Run focused/relevant integration tests and exact-head CI; prepare a review-ready PR and stop before merge for Product Owner
  review.
