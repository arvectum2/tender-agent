task_id: PRODUCT-SHELL-UX-ITERATION-001
authority: AUTO
goal: Exercise the current canonical Tender Agent UI as an operator over RDC/browser, search active software-development procurements using the user-specified queries, verify that the expected Axioma procurement is discoverable, and capture concrete UX/search defects without mutating ARV-005 pilot evidence.
definition_of_done:
  - Canonical UI exercised through Safari on the Mac mini, not only through backend API calls.
  - Searches attempted for "разработка ПО" and "разработка программн обеспеч" with 44-FZ/current-date intent.
  - Search results inspected for expected Axioma procurement and key result fields.
  - Blocking UI/search defects recorded with reproducible evidence.
  - Checkpoint updated with exact next action.
completed:
  - Opened http://127.0.0.1:8092/demo/tender-agent in Safari over RDC and interacted with the rendered UI.
  - Search 1: "разработка ПО", source public_eis_html_44fz, law 44-ФЗ, publication window 2026-09-01..2026-10-03, max 20. Returned 20 results dominated by generic "разработка" matches and did not surface Axioma in the inspected result set.
  - Search 2: "разработка программн обеспеч" with the same source/law/date/max filters. Returned 20 results and surfaced Axioma procurement 0187200001726001304.
  - Axioma card title: "Оказание услуг по разработке модуля для определения пересечений границ земельных участков с землями лесного фонда для программного обеспечения «Автоматизированная географическая информационная система «Аксиома»"; initial price 521000 RUB; publication date 23.09.2026.
  - External current-source verification found the same procurement with application deadline 05.10.2026, confirming it was active during this UX test on 03.10.2026.
  - Clicked "Получить документацию и анализировать" on the Axioma result card. UI entered "Запрашиваем документацию ... через getDocsIP…" and remained in a synchronous-looking wait state during observation.
findings:
  - severity: P0
    issue: No explicit procurement-status filter exists in the search form, so the operator cannot request only active/current procurements from the UI.
  - severity: P0
    issue: Search phrase "разработка ПО" is too broad/noisy in the current public EIS path; visible results are dominated by unrelated generic "разработка" procurements.
  - severity: P1
    issue: Axioma is discoverable with the truncated phrase "разработка программн обеспеч", but the card shows customer_name missing.
  - severity: P1
    issue: All visible relevance fields on Axioma are zero and the card is labeled "НЕ РЕКОМЕНДОВАНО" despite direct textual match to software-development intent; supplier-profile relevance is not appropriate for this initial discovery query.
  - severity: P1
    issue: Some search cards show corrupted customer_name values containing HTML/JavaScript fragments; this confirms search-card customer attribution remains unsafe.
  - severity: P1
    issue: Search diagnostics text is internally contradictory ("токен найден" vs "токен не найден" / endpoint undefined).
  - severity: P1
    issue: Search-result handoff immediately requests download + analysis in one UI action and provides only a waiting flash message; observed interaction did not transition promptly to a run/progress page.
current: First operator UX iteration completed; expected Axioma procurement is discoverable, but search/status/relevance/handoff UX needs hardening before user acceptance.
