task_id: ARV-008-WORKER-TRANSPORT-V1-001
authority: OWNER_DIRECTIVE
goal: Implement the first bounded ARV-008 worker-runtime slice by adapting the frozen ARV-007 Redis foundation into a durable separate-process job transport for existing tender-research background jobs.
definition_of_done:
- Use existing redis-py and QueueEnvelope; no Celery/RQ/Dramatiq dependency and no new product priority.
- Add a Redis Streams transport with consumer-group delivery, acknowledgement, lease refresh and stale-message reclaim matching the existing queue visibility-timeout contract.
- Add a standalone tender-analysis worker process that dispatches existing prepare/analyze job functions and preserves PostgreSQL as source of truth.
- Add explicit thread|redis backend selection; redis backend fails closed when Redis is disabled/unavailable and never silently falls back to in-process execution.
- Add bounded retry/backoff with max attempts and durable job-state reconciliation after worker restart.
- Add deterministic unit/integration-facing regression coverage for queue transport, worker dispatch/retry/reclaim and backend fail-closed behavior.
- Preserve existing thread backend as an explicit compatibility mode; do not change production configuration, external systems, procurement state, ARV-ID mappings or Company/Product authority.
- Record ARV-008 residual scope: pause/resume, per-tenant concurrency and cost budgets remain later bounded slices; this task does not claim full ARV-008 completion.
- Run focused tests, make check and exact-head CI; prepare a review-ready PR. Merge remains REVIEW-gated pending attributable Owner AM-4 renewal.
completed:
- Read canonical ARV-008 and ARV-007 evidence.
- Confirmed ARV-007 explicitly freezes Redis queue envelope/300s lease for ARV-008 and defers worker process, queue runtime and ThreadPoolExecutor migration.
- Confirmed current tender-research jobs are durable PostgreSQL rows but execution is in-process ThreadPoolExecutor.
- Selected Redis Streams consumer groups as an ADAPT implementation of the already-canonical Redis queue/lease contract, using installed redis-py and no new dependency.
- Implemented Redis Streams QueueEnvelope transport with consumer groups, acknowledgement, lease refresh, stale reclaim and bounded retry publication.
- Added standalone tender-analysis worker with PostgreSQL state reconciliation and explicit thread|redis backend selection.
- Redis submission failures now fail closed with sanitized 503 and durable failed job state; no implicit thread fallback.
- Added worker/runtime documentation, env examples, unit coverage and Redis integration coverage.
- Hardened stream retention: enqueue never trims potentially pending Redis Stream entries; ACK/retry explicitly delete only acknowledged deliveries.
- Focused worker/API/queue/job-service suite passed: 42 tests.
- Broader tender_research + unit/redis suite passed: 485 passed, 9 skipped.
- uv run make check PASS; targeted Ruff PASS; git diff --check PASS.
- Local real-Redis integration could not start because the Mac mini Colima/Docker daemon is not running; GitHub CI redis-integration will be authoritative.
