goal: Add tenant-isolated reusable company profile facts and company-document version
  bindings for statutory documents, licenses, certificates, experience, requisites
  and templates, with explicit expiry and safe provenance-preserving autofill that
  never imports unrelated private data.
definition_of_done:
- Every company profile fact and reusable document is scoped by customer_id; cross-tenant
  reads/writes and cross-tenant artifact reuse fail closed.
- Profile facts are append-versioned, source-bound and explicit; safe autofill returns
  only requested, explicitly stored, non-expired current facts and never infers values
  from unrelated documents.
- Reusable company documents support statutory, license, certificate, experience,
  requisites and template categories with immutable version bindings to exact DocumentArtifact
  versions and explicit expiry status.
- Expired documents/facts are visible as expired evidence but are excluded from active/autofill
  selection by default; superseded versions remain auditable.
- Company-document artifacts used for reusable profile storage are tenant-bound through
  company-document metadata and cannot be silently reused across tenants or from unrelated
  deal-bound artifacts.
- Only synthetic fixtures are used in tests; no unrelated real private documents are
  imported or scanned.
- Focused tenant/version/expiry/autofill/private-boundary regressions and relevant
  customer/document-store tests pass, followed by exact-head GitHub CI.
