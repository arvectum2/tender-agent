resume_instruction: Do not repeat this UX iteration. Start a new bounded PRODUCT-SHELL-SEARCH-HARDENING task to add an explicit active-status filter, tighten public search query semantics, fail closed on corrupted/missing customer attribution, make discovery relevance meaningful for user search intent, reconcile diagnostics copy, and make search-result handoff asynchronous/progress-visible. Preserve ARV-005 pilot evidence unchanged.
