development_strategy:
  principle: copy_commodity_invent_moat
  architecture_thesis: thin_commodity_shell_plus_deep_decision_core
  owner_directive: "Before designing a feature from scratch, identify who already solved the problem and prefer reuse or reimplementation of the proven public pattern."
  allowed_delivery_strategies:
    REUSE: "Use an existing OSS/library/component when licensing, security and maintenance fit."
    COPY_PATTERN: "Reimplement a proven public UX/workflow/functional pattern; do not copy proprietary source code, assets, text or private datasets."
    ADAPT: "Integrate or adapt an existing API, protocol, service or standard component."
    INVENT: "Build custom behavior only when a documented gap or defensible product advantage justifies ownership."
  invent_gate:
    required: true
    checks:
      - reusable OSS/API/public patterns checked
      - gap documented with evidence
      - differentiation tied to Decision Core, Commercial Core or procurement-specific edge cases
      - maintenance cost justified
    fallback_without_justification: "REUSE, COPY_PATTERN or ADAPT"
  commodity_reuse_target_pct: 70
  success_metrics:
    - "At least 70% of new P0/P1 commodity work resolves through REUSE/COPY_PATTERN/ADAPT."
    - "100% of substantive GO/NO-GO claims have source evidence or explicit Unknown."
    - "No hard decision without a traceable document/page/fragment evidence chain."
    - "Every confirmed real failure or procurement edge case becomes a regression case."
    - "Competitor benchmark/reverse-spec is refreshed at milestone boundaries before widening commodity scope."
  do_not_build_from_scratch_without_explicit_gap:
    - custom OCR engine
    - custom PDF renderer/viewer
    - custom vector database or generic search infrastructure
    - custom authentication framework
    - generic chatbot or generic RAG shell
    - bespoke notification service
    - custom analytics/dashboard platform
    - CRM clone
    - premature distributed infrastructure or performance optimization
    - AI feature without a measurable decision or next-action outcome
accelerated_plan:
  - stage: 0
    name: competitive_reverse_spec_and_reuse_registry
    priority: P0
    objective: "Benchmark 8-10 direct competitors across search -> results -> tender card -> documents -> AI analysis -> decision -> next action; record best public patterns, reusable components/APIs, legal/license constraints and de-scope decisions."
    exit_gate: "Every active P0/P1 item is classified REUSE/COPY_PATTERN/ADAPT/INVENT; every INVENT has written justification."
    current_state: done
    current_evidence: 'PR #56 merged as 8b1c131941e76b079a1eac18cf3a71201a6c01ce; 9 direct products, 10 reuse candidates, active P0/P1 classification and commodity de-scope.'
  - stage: 1
    name: thin_commodity_shell
    priority: P0
    objective: "Keep only baseline search/filter/saved views, tender card, document viewing/parsing adapters, auth/roles, alerts and export; prefer proven components and patterns, no gold-plating."
    exit_gate: "Commodity shell is usable end-to-end and no commodity item has become a custom multi-sprint build without an approved gap."
    current_state: partial_existing_not_separately_gated
    current_evidence: 'Baseline shell pre-existed this acceleration cycle; Docker-context hardening PR #58 merged as 8924a8576a96ccac490682be737f2b041c8a06e3. No standalone Stage 1 completion gate is admitted.'
  - stage: 2
    name: decision_core_v1
    priority: P0
    objective: "Invest custom engineering in canonical tender facts, evidence primitives, hard blockers, deterministic rules, GO/NO-GO/NEEDS REVIEW, risk/unknown/confidence and clickable evidence."
    exit_gate: "Decision outputs are measurable against a regression corpus and every material conclusion is source-bound or explicitly unknown."
    current_state: done
    current_evidence: 'DISCOVERY-QA-001 PR #59 merged as 762a392207a73ed77b04af69a378746920960ba8; Decision Core v1 PR #61 merged as 3bf397f24c997f2465af38b8c51c329309b1f8d1.'
  - stage: 3
    name: commercial_core
    priority: P0
    objective: "Build nomenclature normalization, customer-catalog matching, substitutes/compatibility, Supplier -> RFQ -> TKP, landed cost, margin and bid economics, with recomputation when quotes change."
    exit_gate: "Bid/no-bid can be tied to commercial feasibility with auditable inputs and human control."
    current_state: done
    current_evidence: 'Commercial Core v1 PR #63 merged as 4257cd23d68d4ad69ebbedf075195f34969bace1 after Product Owner approval and post-sync exact-head CI 34990327143 SUCCESS 9/9.'
  - stage: 4
    name: automation_and_integrations
    priority: P1
    objective: "Add integrations, webhooks/APIs, saved-search alerts, email/CRM/source connectors and scheduled reporting only where they shorten validated workflows."
    exit_gate: "Automations reduce operator work without crossing external-action/human-control boundaries."
    current_state: admitted_in_progress
    current_evidence: 'Owner queue-fill directive 2026-09-15 admitted CHANGE-MONITORING-V1-001 (#65), INGEST-RESILIENCE-V1-001 (#66) and INTEGRATION-OUTBOX-V1-001 (#67). External notification/delivery remains disabled and separately gated.'
  - stage: 5
    name: reliability_and_moat
    priority: P1
    objective: "Compound 44-FZ/223-FZ/private-procurement edge cases, regression evidence, decision/outcome telemetry, security/compliance and workflow integration depth."
    exit_gate: "Moat is evidenced by domain-specific regression depth, integration depth and measured decision quality rather than commodity feature count."
    current_state: admitted_queued
    current_evidence: 'Owner queue-fill directive 2026-09-15 admitted OPS-OBSERVABILITY-V1-001 (#68), 223FZ-INGEST-V1-001 (#69), 223FZ-DECISION-V1-001 (#70) and DOMAIN-REGRESSION-V1-001 (#71). Review-gated semantics/benchmark changes remain auto_merge=false.'
