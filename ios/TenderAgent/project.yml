name: TenderAgent
options:
  bundleIdPrefix: com.arvectum
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "VML75VY94V"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.6.0"
targets:
  TenderAgent:
    type: application
    platform: iOS
    sources:
      - TenderAgentApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arvectum.tenderagent
        PRODUCT_NAME: TenderAgent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tender Agent
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - TenderAgentTests
  TenderAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TenderAgentAppTests
    dependencies:
      - target: TenderAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arvectum.tenderagent.tests
        GENERATE_INFOPLIST_FILE: YES
